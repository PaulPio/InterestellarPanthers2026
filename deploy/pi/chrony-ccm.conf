# Serve time to the cabin node so its readings carry the time they were measured.
# Debian's chrony.conf includes /etc/chrony/conf.d/*.conf.
# Private address ranges only: the Pi's own hotspot (192.168.4.0/24) or a shared WiFi such as
# a phone hotspot. Never the public internet.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16
local stratum 10
