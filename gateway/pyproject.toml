[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccm-gateway"
version = "0.1.0"
description = "Crew Context Monitor gateway for the Pi: MQTT ingest, analytics, local and public APIs"
requires-python = ">=3.11"
dependencies = [
  "ccm-sim",
  "numpy",
  "pyyaml",
  "paho-mqtt>=2,<3",
  "fastapi",
  "uvicorn",
  "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML", "amqtt"]

[project.scripts]
ccm-gateway = "ccm_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
